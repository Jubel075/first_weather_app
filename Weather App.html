<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the network paths the app hits on first paint: TLS + DNS done
         before the first weather request fires. -->
    <link rel="preconnect" href="https://api.openweathermap.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.openweathermap.org" />
    <link rel="preconnect" href="https://tile.openweathermap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openweathermap.org" />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* type */
        --serif: "Instrument Serif", ui-serif, Georgia, serif;
        --sans: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;

        /* condition-driven palette (JS overwrites these live) */
        --bg-0: #1b2a4a;
        --bg-1: #2d4470;
        --bg-2: #38597f;
        --accent: oklch(0.78 0.14 235);
        --accent-soft: oklch(0.78 0.14 235 / 0.22);
        --ink: #f6f8fd;            /* primary text */
        --ink-soft: rgba(246, 248, 253, 0.72);
        --ink-faint: rgba(246, 248, 253, 0.46);

        /* glass system (direction overwrites alpha/blur/radius) */
        --glass-bg: rgba(255, 255, 255, 0.1);
        --glass-bg-strong: rgba(255, 255, 255, 0.16);
        --glass-border: rgba(255, 255, 255, 0.22);
        --glass-blur: 26px;
        --glass-sat: 1.6;
        --radius: 26px;
        --radius-sm: 16px;
        --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.55);

        /* type emphasis (direction tweaks) */
        --temp-scale: 1;
        --serif-emphasis: 1;

        --fx-opacity: 1;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c1322;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }

      #root { height: 100%; }

      /* animated gradient field — transitions when condition theme changes */
      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(120% 90% at 80% -10%, var(--bg-2) 0%, transparent 55%),
          radial-gradient(140% 120% at 10% 110%, var(--bg-0) 0%, transparent 60%),
          linear-gradient(165deg, var(--bg-1) 0%, var(--bg-0) 100%);
        transition: background 1200ms ease, --bg-0 1200ms, --bg-1 1200ms, --bg-2 1200ms;
      }
      .sky-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: var(--fx-opacity); }
      .sky-veil  { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

      .app-scroll {
        position: relative;
        z-index: 3;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: var(--glass-border) transparent;
      }
      .app-scroll::-webkit-scrollbar { width: 10px; }
      .app-scroll::-webkit-scrollbar-thumb {
        background: var(--glass-border);
        border-radius: 99px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }

      .glass {
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
        border: 1px solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .glass-strong { background: var(--glass-bg-strong); }

      .mono { font-family: var(--mono); }
      .serif { font-family: var(--serif); }

      .label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      button { font-family: inherit; color: inherit; cursor: pointer; }
      input { font-family: inherit; }

      ::selection { background: var(--accent); color: #0c1322; }

      .fade-enter { opacity: 0; transform: translateY(14px) scale(0.995); }
      .fade-in { opacity: 1; transform: none; transition: opacity 600ms ease, transform 600ms cubic-bezier(0.16,1,0.3,1); }

      @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.14) 37%, rgba(255,255,255,0.06) 63%);
        background-size: 200% 100%;
        animation: shimmer 1.6s infinite linear;
        border-radius: 12px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 0.9s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .sky-canvas { display: none; }
      }

      /* ---- responsive grid ---- */
      .wx-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: var(--gap, 16px);
        align-items: start;
      }
      .wx-hero    { grid-column: span 8; }
      .wx-wind    { grid-column: span 4; }
      .wx-hourly  { grid-column: span 12; }
      .wx-details { grid-column: span 4; }
      .wx-sun     { grid-column: span 4; }
      .wx-air     { grid-column: span 4; }
      .wx-daily   { grid-column: span 6; }
      .wx-map     { grid-column: span 6; }

      @media (max-width: 1080px) {
        .wx-hero, .wx-hourly { grid-column: span 12; }
        .wx-wind, .wx-details, .wx-sun, .wx-air, .wx-daily, .wx-map { grid-column: span 6; }
      }
      @media (max-width: 680px) {
        .wx-grid > * { grid-column: span 12 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

    <!-- Precompiled to plain JS (build.js) — no in-browser Babel transform on load. -->
    <script src="tweaks-panel.js"></script>
    <script src="src/api-key.js"></script>
    <script src="src/api.js"></script>
    <script src="src/perf.js"></script>
    <script src="src/background.js"></script>
    <script src="src/widgets.js"></script>
    <script src="src/panels.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
