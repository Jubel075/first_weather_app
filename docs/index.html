<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the network paths the app hits on first paint: TLS + DNS done
         before the first weather request fires. -->
    <link rel="preconnect" href="https://api.openweathermap.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.openweathermap.org" />
    <link rel="preconnect" href="https://tile.openweathermap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openweathermap.org" />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>

    <!-- Precompiled to plain JS (build.js) — no in-browser Babel transform on load. -->
    <script src="tweaks-panel.js"></script>
    <script src="api-key.js"></script>
    <script src="src/api.js"></script>
    <script src="src/perf.js"></script>
    <script src="src/background.js"></script>
    <script src="src/widgets.js"></script>
    <script src="src/panels.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
